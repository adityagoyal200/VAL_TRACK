[package]
name = "riot-core"
version = "0.1.0"
edition = "2021"
description = "Read-only local Riot client + Valorant PVP API client"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Lean HTTP + OS-native TLS (SChannel) — avoids compiling ring/aws-lc C crypto.
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip", "json"] }
native-tls = "0.2"
base64 = "0.22"
